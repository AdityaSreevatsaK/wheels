name: Check

# The offline tests for scripts/ on every pull request and push to main.

on:
  pull_request:
  push:
    branches: [main, docs/17-self-verification-and-bug-report]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Tests
        run: uvx --python 3.14 pytest@8.4.2
