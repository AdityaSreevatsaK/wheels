name: Migrate from the tracker (one-time)

# Copies the 12 wheels first published on wheelgap/tracker's release here, each only with the sha256
# data/gap-wheels.json records, attests them from this repo and uploads them to this repo's `gap-wheels` release.
# Delete this workflow once it has run.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: publish
    permissions:
      contents: write # the gap-wheels release
      id-token: write # attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download each wheel and check it against the index
        run: python3 scripts/migrate_from_tracker.py data/gap-wheels.json release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.whl
      - name: Upload to this repo's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view gap-wheels >/dev/null 2>&1 || gh release create gap-wheels --prerelease --title "Gap wheels" \
            --notes "Wheels PyPI is missing, each built twice from PyPI's sdist and published only when both builds match. Index and details: https://wheelgap.github.io/wheels/"
          gh release upload gap-wheels release/*.whl --clobber
