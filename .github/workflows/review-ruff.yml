name: Temporary Ruff review

on:
  push:
    branches: [design/4-build-tool-provenance]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install Ruff from pinned PyPI release
        run: python -m pip install ruff==0.14.7
      - name: Check all changed Python files
        run: python -m ruff check scripts/build_tool_lock.py scripts/gap_wheels.py scripts/build_lab.py tests/test_build_tool_lock.py tests/test_gap_wheels.py
