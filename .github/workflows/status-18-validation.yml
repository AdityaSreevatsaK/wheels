name: Temporary status JSON validation (#18)

on:
  push:
    branches: [feat/18-machine-readable-wheel-status]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Project test suite (Python 3.14)
        run: uvx --python 3.14 pytest@8.4.2
