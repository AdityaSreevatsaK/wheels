name: Temporary Windows MSVC environment probe for PR 14

on:
  push:
    branches: [design/4-build-tool-provenance]

permissions:
  contents: read

jobs:
  select-msvc:
    name: MSVC ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            python: "3.15"
            target: "3.15 win-amd64"
          - runner: windows-11-arm
            python: "3.14"
            target: "3.14 win-arm64"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify VS environment and selected executable record
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          @'
          import os
          from pathlib import Path
          from scripts import gap_wheels

          cc, link = gap_wheels._msvc_tools(os.environ["TARGET"])
          assert cc and link, "The selected MSVC toolchain did not initialise"
          assert os.environ.get("DISTUTILS_USE_SDK") == "1"
          assert os.environ.get("MSSdk") == "1"
          assert Path(os.environ["CC"]).is_file()
          assert Path(os.environ["CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER"
                                if "arm64" in os.environ["TARGET"]
                                else "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER"]).is_file()
          print("Validated MSVC toolchain; compiler and linker records are nonempty")
          '@ | python -
