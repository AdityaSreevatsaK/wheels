name: Temporary hash-locked Linux repair probe

on:
  push:
    branches: [design/4-build-tool-provenance]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Resolve, build and repair using only hash-locked tools
        run: |
          python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path
          from scripts import build_tool_lock, gap_wheels

          pair = {"name": "lz4", "version": "4.4.5", "target": "3.15 linux-x86_64"}
          lock = build_tool_lock.resolve(pair)
          names = {w["name"] for w in lock["wheels"]}
          assert {"auditwheel", "patchelf", "pip"} <= names, names
          print("LOCKED TOOL NAMES:", sorted(names))
          with tempfile.TemporaryDirectory() as folder:
              root = Path(folder)
              py, pkgs = build_tool_lock.create_build_environment(lock, root)
              sdist = root / lock["sdist"]
              build_tool_lock.download_locked({"url": lock["sdist_url"], "sha256": lock["sdist_sha256"]}, sdist)
              src = gap_wheels.unpack(sdist, root / "fixed")
              out = root / "built"
              cmd = [str(py), "-m", "pip", "wheel", "--no-index", "--no-build-isolation", "--no-deps",
                     "-w", str(out), str(src)]
              built = subprocess.run(cmd, capture_output=True, text=True, timeout=300)
              print("BUILT:", built.returncode, (built.stdout + built.stderr)[-2000:])
              if built.returncode != 0:
                  raise SystemExit(1)
              wheels = list(out.glob("*.whl"))
              assert len(wheels) == 1, wheels
              repaired = gap_wheels.repair(wheels[0], root, locked_python=py)
              assert repaired is not None, "auditwheel repair failed"
              assert repaired.is_file()
              print("REPAIRED ONLY WITH PINNED TOOLS:", repaired.name)
          PY
