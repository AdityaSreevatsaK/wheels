name: Temporary Ruff review for PR 14
on:
  push:
    branches: [design/4-build-tool-provenance]
permissions:
  contents: read
jobs:
  review-ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Report Ruff findings under repository configuration
        run: uvx ruff check scripts/build_lab.py scripts/build_tool_lock.py scripts/gap_wheels.py || true
