name: Temporary no-publication build lock coverage

on:
  push:
    branches: [design/4-build-tool-provenance]

permissions:
  contents: read

jobs:
  resolve:
    name: No-publish ${{ matrix.kind }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        kind: [candidate, published]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Load read-only upstream snapshot and resolve static build/repair tools
        env:
          KIND: ${{ matrix.kind }}
          SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          curl -sfL --max-time 50 -o "$RUNNER_TEMP/builds.json" \
            https://raw.githubusercontent.com/wheelgap/tracker/main/data/builds.json
          curl -sfL --max-time 50 -o "$RUNNER_TEMP/published.json" \
            https://raw.githubusercontent.com/wheelgap/wheels/main/data/gap-wheels.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts import gap_wheels, build_tool_lock

          root = Path(os.environ["RUNNER_TEMP"])
          candidates = gap_wheels.clean_pairs(json.loads((root / "builds.json").read_text()))
          published = [
              {key: w[key] for key in ("name", "version", "target")}
              for w in json.loads((root / "published.json").read_text())["wheels"]
          ]
          kind, shard = os.environ["KIND"], int(os.environ["SHARD"])
          all_pairs = candidates if kind == "candidate" else published
          pairs = [p for n, p in enumerate(all_pairs) if n % 4 == shard]
          jobs = [{**p, "id": str(n), "attempt": 1} for n, p in enumerate(pairs)]
          report = []
          selected, _ = build_tool_lock.lock_plan(jobs, report)
          locked = len(selected)
          data = {"kind": kind, "shard": shard, "total": len(pairs), "locked": locked,
                  "skipped": len(pairs) - locked, "pairs": report}
          Path("coverage-report.json").write_text(json.dumps(data, indent=2) + "\n")
          summary = [
              f"## {kind}: shard {shard}",
              f"{locked} locked, {len(pairs) - locked} skipped of {len(pairs)}",
              "", "| Pair | Status |", "|---|---|",
          ]
          summary.extend(f"| {name} | {status.replace('|', '/')} |" for name, status in report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(summary) + "\n")
          print(json.dumps(data, indent=2))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ matrix.kind }}-${{ matrix.shard }}
          path: coverage-report.json
          if-no-files-found: ignore
          retention-days: 7
