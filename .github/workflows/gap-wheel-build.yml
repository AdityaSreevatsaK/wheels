name: Gap wheel build

# One build of one gap-wheels pair, started by gap-wheels.yml (`gap_wheels.py dispatch`). Each build gets a workflow
# run of its own so that its artifact token, which the package's build code can read, can't write another build's
# result: the coordinator takes a result only from the one run with that build's exact title. See
# scripts/gap_wheels.py. The wheel is kept as this run's `wheel` artifact; the coordinator takes it only if its sha256
# is the one both builds reported. This run's token is read-only. Don't add actions/cache (or a setup action's cache)
# here: build code can write cache entries other workflows on main would restore.
run-name: gap-wheel ${{ inputs.batch }} ${{ inputs.name }} ${{ inputs.version }} ${{ inputs.target }} build ${{ inputs.attempt }}

on:
  workflow_dispatch:
    inputs:
      batch:
        required: true
      name:
        required: true
      version:
        required: true
      target:
        required: true
      attempt:
        required: true
      runner:
        required: true
      python:
        required: true
      image:
        default: ""
      coordinator_run:
        required: true
      pair_id:
        required: true
      lock_sha256:
        required: true

permissions:
  contents: read
  actions: read # download the coordinator's pinned lock; untrusted code cannot modify it

jobs:
  build:
    if: inputs.image == ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python }}
      - name: Download the coordinator's build-tool locks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-tool-locks
          repository: ${{ github.repository }}
          run-id: ${{ inputs.coordinator_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/locks
      - name: Build from the sdist, hash, and (build 1) install
        shell: bash
        env:
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
          ATTEMPT: ${{ inputs.attempt }}
          RUNNER: ${{ inputs.runner }}
          PAIR_ID: ${{ inputs.pair_id }}
          LOCK_SHA256: ${{ inputs.lock_sha256 }}
        run: python scripts/gap_wheels.py build --name "$NAME" --version "$VERSION" --target "$TARGET" --attempt "$ATTEMPT" --runner "$RUNNER" --out result.json --wheel-dir "$RUNNER_TEMP/wheel" --lock-bundle "$RUNNER_TEMP/locks/build-tool-locks.json" --lock-sha256 "$LOCK_SHA256" --pair-id "$PAIR_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: result
          path: |
            result.json
            members.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wheel
          path: ${{ runner.temp }}/wheel/*.whl
          if-no-files-found: ignore
          retention-days: 7

  build-docker:
    # Targets with an image (musl in Alpine, glibc in manylinux_2_28) build inside it, with `docker run`: JavaScript
    # actions can't run inside an Alpine container on ARM runners. scripts/container_build.sh installs the image's
    # build tools and a pinned Rust, then builds with the image's interpreter for the target (the `python` input).
    if: inputs.image != ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the coordinator's build-tool locks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-tool-locks
          repository: ${{ github.repository }}
          run-id: ${{ inputs.coordinator_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/locks
      - name: Build from the sdist in the target's image, hash, and (build 1) install
        env:
          IMAGE: ${{ inputs.image }}
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
          ATTEMPT: ${{ inputs.attempt }}
          RUNNER: ${{ inputs.runner }}
          INTERPRETER: ${{ inputs.python }}
          PAIR_ID: ${{ inputs.pair_id }}
          LOCK_SHA256: ${{ inputs.lock_sha256 }}
        run: |
          # The checkout is mounted read-only; the result goes to its own folder.
          mkdir -p "$RUNNER_TEMP/out"
          docker run --rm -v "$PWD:/lab:ro" -v "$RUNNER_TEMP/out:/out" -v "$RUNNER_TEMP/locks:/locks:ro" -w /lab \
            -e NAME -e VERSION -e TARGET -e ATTEMPT -e RUNNER -e INTERPRETER -e PAIR_ID -e LOCK_SHA256 "$IMAGE" sh scripts/container_build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: result
          path: |
            ${{ runner.temp }}/out/result.json
            ${{ runner.temp }}/out/members.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wheel
          path: ${{ runner.temp }}/out/wheel/*.whl
          if-no-files-found: ignore
          retention-days: 7
